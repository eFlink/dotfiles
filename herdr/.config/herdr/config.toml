onboarding = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = false

[keys]

# Navigation mode keys (for when you press prefix+w to open workspace picker)
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# navigate_pane_down = "j"
# navigate_pane_up = "k"
navigate_pane_right = "l"
navigate_pane_left = "h"

# vim-style pane focus shortcuts with prefix
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Split panes with '%' and '"'
split_vertical = "prefix+percent"
split_horizontal = "prefix+\""

# Detach off prefix+q (tmux's native detach key); frees prefix+q
detach = "prefix+d"

# Jump to pane/agent by number with shift; prefix+1..9 stays on tab switching
focus_agent = "prefix+shift+1..9"
